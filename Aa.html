<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Rezonans ve Tıkanıklık Testi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e24; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { background: #2b2b36; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 600px; width: 100%; text-align: center; }
        h2 { margin-top: 0; color: #4dabf7; }
        .btn { background: #4dabf7; color: #1e1e24; border: none; padding: 15px 24px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn:hover { background: #3bc9db; }
        .btn-stop { background: #fa5252; color: white; display: none; }
        .btn-stop:hover { background: #e03131; }
        canvas { width: 100%; height: 150px; background: #151519; border-radius: 8px; margin-top: 20px; border: 1px solid #333; }
        
        .live-panel { margin-top: 30px; padding: 20px; background: #151519; border-radius: 8px; border: 1px solid #444; }
        .score-title { font-size: 20px; margin-bottom: 15px; color: #ced4da; }
        .score-number { font-size: 48px; font-weight: bold; color: #4dabf7; margin: 10px 0; }
        
        .progress-bg { width: 100%; background-color: #333; border-radius: 10px; height: 30px; overflow: hidden; position: relative; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #4dabf7, #fa5252); transition: width 0.1s ease-out; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Canlı Burun Tıkanıklığı Testi</h2>
        <p style="color: #adb5bd; font-size: 15px;">
            Mikrofonu açın ve <strong>"Mmmmmmmmm"</strong> veya <strong>"Nnnnnnnn"</strong> diyerek sesi uzatın. Sesi uzatırken <strong>burnunuzu parmaklarınızla sıkıp bırakın.</strong> Çubuğun anında fırladığını göreceksiniz.
        </p>
        
        <button id="startBtn" class="btn">🎤 Mikrofonu Aç ve Teste Başla</button>
        <button id="stopBtn" class="btn btn-stop">⏹️ Testi Durdur</button>
        
        <canvas id="visualizer"></canvas>

        <div class="live-panel">
            <div class="score-title">Anlık Tıkanıklık / Boğukluk Oranı</div>
            <div class="score-number" id="scoreText">%0</div>
            <div class="progress-bg">
                <div class="progress-bar" id="scoreBar"></div>
            </div>
            <p id="statusText" style="margin-top: 15px; font-weight: bold; color: #adb5bd;">Ses bekleniyor...</p>
        </div>
    </div>

    <script>
        let audioContext, analyser, microphone, animationId;
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const scoreText = document.getElementById('scoreText');
        const scoreBar = document.getElementById('scoreBar');
        const statusText = document.getElementById('statusText');

        canvas.width = canvas.clientWidth; 
        canvas.height = 150;

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false } 
                });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                
                analyser.fftSize = 1024;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';

                function analyzeLive() {
                    animationId = requestAnimationFrame(analyzeLive);
                    analyser.getByteFrequencyData(dataArray);

                    // Ekranı temizle (Ses Dalgalarını Çizmek İçin)
                    canvasCtx.fillStyle = '#151519';
                    canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

                    let lowEnergy = 0, lowCount = 0;
                    let highEnergy = 0, highCount = 0;
                    const barWidth = (canvas.width / bufferLength) * 2.5;
                    let x = 0;

                    for (let i = 0; i < bufferLength; i++) {
                        let barHeight = dataArray[i];
                        let freq = i * audioContext.sampleRate / analyser.fftSize;

                        // Ses dalgalarını ekrana çiz
                        canvasCtx.fillStyle = `rgb(${barHeight + 50}, 150, 250)`;
                        canvasCtx.fillRect(x, canvas.height - (barHeight / 2), barWidth, barHeight / 2);
                        x += barWidth + 1;

                        // Kalın ses (Burun tıkalıyken artan uğultu frekansı)
                        if (freq > 80 && freq < 400) {
                            lowEnergy += barHeight;
                            lowCount++;
                        }
                        // İnce ses (Burun tıkalıyken tamamen kaybolan hava frekansı)
                        if (freq > 1200 && freq < 4000) {
                            highEnergy += barHeight;
                            highCount++;
                        }
                    }

                    // Ortalamaları al
                    let avgLow = lowCount > 0 ? lowEnergy / lowCount : 0;
                    let avgHigh = highCount > 0 ? highEnergy / highCount : 0;
                    let totalEnergy = avgLow + avgHigh;

                    // Eğer ortam çok sessizse skoru 0'da tut (arka plan gürültüsünü engellemek için)
                    if (totalEnergy < 15) {
                        updateUI(0, "Ses bekleniyor...");
                        return;
                    }

                    // Boğukluk Formülü: Kalın sesin toplam sese oranı (0.0 ile 1.0 arası)
                    let ratio = avgLow / totalEnergy; 

                    // Oranı %0 ile %100 arasına matematiksel olarak yay (0.55 altı normal, 0.85 üstü tam tıkalı)
                    let currentScore = Math.round((ratio - 0.55) * 333); 
                    
                    if (currentScore < 0) currentScore = 0;
                    if (currentScore > 100) currentScore = 100;

                    let status = "Normal Rezonans";
                    if (currentScore > 75) status = "⚠️️ Yüksek Tıkanıklık (Boğuk Ses)";
                    else if (currentScore > 40) status = "Hafif Tıkanıklık";

                    updateUI(currentScore, status);
                }
                analyzeLive();
            } catch (err) {
                alert('Mikrofon erişimine izin vermeniz gerekiyor.');
            }
        });

        stopBtn.addEventListener('click', () => {
            cancelAnimationFrame(animationId);
            if (audioContext && audioContext.state !== 'closed') audioContext.close();
            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';
            updateUI(0, "Test durduruldu.");
        });

        function updateUI(score, text) {
            scoreText.innerText = `%${score}`;
            scoreBar.style.width = `${score}%`;
            statusText.innerText = text;

            if (score > 75) {
                scoreText.style.color = '#fa5252'; // Kırmızı
            } else if (score > 40) {
                scoreText.style.color = '#fcc419'; // Sarı
            } else {
                scoreText.style.color = '#4dabf7'; // Mavi
            }
        }
    </script>
</body>
</html>
