<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerçek Rezonans Testi (Sesten Bağımsız)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { background: #1e293b; padding: 30px; border-radius: 12px; max-width: 600px; width: 100%; text-align: center; border: 1px solid #334155; }
        h2 { margin-top: 0; color: #38bdf8; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 15px 24px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; transition: 0.2s; margin-bottom: 15px;}
        .btn:hover { background: #0284c7; }
        .btn-stop { background: #ef4444; color: white; display: none; }
        
        .gauge-container { margin-top: 30px; position: relative; width: 100%; height: 40px; background: #334155; border-radius: 20px; overflow: hidden; border: 2px solid #475569; }
        
        /* Sadece tınıyı gösteren çubuk */
        .gauge-bar { height: 100%; width: 50%; background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444); transition: width 0.1s linear; border-radius: 20px; }
        
        .labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: #94a3b8; font-weight: bold; }
        
        .debug-panel { margin-top: 25px; padding: 15px; background: #0f172a; border-radius: 8px; font-size: 13px; color: #64748b; text-align: left;}
        #volumeIndicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: red; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Gerçek Burun Rezonans Testi</h2>
        <p style="color: #cbd5e1; font-size: 15px;">
            Ağzınız açık şekilde <strong>"İiiiiiiiii"</strong> deyin. İsterseniz fısıldayın, isterseniz bağırın. İbre sadece burnunuzu kapattığınızda sağa (Kırmızıya) kaymalıdır.
        </p>
        
        <button id="startBtn" class="btn">🎤 Testi Başlat</button>
        <button id="stopBtn" class="btn btn-stop">⏹️ Durdur</button>

        <div class="gauge-container">
            <div class="gauge-bar" id="resonanceBar"></div>
        </div>
        <div class="labels">
            <span>🟢 Açık Ses (Normal)</span>
            <span>🔴 Boğuk/Tıkalı (Nazal)</span>
        </div>

        <div class="debug-panel">
            <div style="margin-bottom: 5px;">
                <span id="volumeIndicator"></span> <span id="volText">Ses Bekleniyor... (Fısıldasanız bile algılar)</span>
            </div>
            <div>Tıkanıklık Oranı: <strong id="scoreText" style="color: #f8fafc;">%0</strong></div>
        </div>
    </div>

    <script>
        let audioContext, analyser, microphone, animationId;
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resonanceBar = document.getElementById('resonanceBar');
        const scoreText = document.getElementById('scoreText');
        const volumeIndicator = document.getElementById('volumeIndicator');
        const volText = document.getElementById('volText');

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false } 
                });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                
                analyser.fftSize = 1024;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';

                function analyzeLive() {
                    animationId = requestAnimationFrame(analyzeLive);
                    analyser.getByteFrequencyData(dataArray);

                    let lowEnergy = 0;
                    let highEnergy = 0;
                    let totalVolume = 0;

                    for (let i = 0; i < bufferLength; i++) {
                        let barHeight = dataArray[i];
                        let freq = i * audioContext.sampleRate / analyser.fftSize;

                        totalVolume += barHeight;

                        // Kalın ve ince frekansları topla
                        if (freq > 100 && freq < 600) lowEnergy += barHeight;
                        if (freq > 1500 && freq < 4000) highEnergy += barHeight;
                    }

                    let avgVol = totalVolume / bufferLength;

                    // Ses var mı yok mu kontrolü (Sessizlikte ibre oynamasın)
                    if (avgVol < 5) {
                        volumeIndicator.style.background = "red";
                        volText.innerText = "Ses bekleniyor...";
                        resonanceBar.style.width = "0%";
                        scoreText.innerText = "%0";
                        return;
                    }

                    volumeIndicator.style.background = "lime";
                    volText.innerText = "Ses Algılanıyor (Şiddetten bağımsız ölçüm yapılıyor)";

                    // İŞTE SİHİRLİ FORMÜL: Ses şiddetini (Volume) formülden çıkarıyoruz!
                    // Sadece düşük ve yüksek frekansların birbirine oranına bakıyoruz.
                    // Yüksek sesle de bağırsan, bu oran (yüzde) sabit kalır.
                    let totalEnergyToCompare = lowEnergy + highEnergy;
                    
                    if (totalEnergyToCompare === 0) return;

                    // Kalın frekansların toplam sese yüzdesi (0 ile 100 arası)
                    let bassPercentage = (lowEnergy / totalEnergyToCompare) * 100;

                    // Normal bir "İiiiii" sesinde kalınlık genelde %40-%65 arasıdır.
                    // Burun kapanınca bu oran %80-%95'lere fırlar.
                    // Kullanıcı için bunu 0-100 barına uyduruyoruz:
                    let displayScore = Math.round((bassPercentage - 50) * 2.5);

                    if (displayScore < 0) displayScore = 0;
                    if (displayScore > 100) displayScore = 100;

                    resonanceBar.style.width = displayScore + '%';
                    scoreText.innerText = `%${displayScore}`;
                }
                analyzeLive();
            } catch (err) {
                alert('Mikrofon izni verilmedi!');
            }
        });

        stopBtn.addEventListener('click', () => {
            cancelAnimationFrame(animationId);
            if (audioContext && audioContext.state !== 'closed') audioContext.close();
            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';
            volumeIndicator.style.background = "red";
            volText.innerText = "Test Durduruldu.";
            resonanceBar.style.width = "0%";
        });
    </script>
</body>
</html>
